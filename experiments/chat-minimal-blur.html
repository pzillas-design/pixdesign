<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PIX Chat - Minimal Blur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap');

  :root {
    --bg: #f0f0f5;
    --accent: #6366f1;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: 
      radial-gradient(circle at 10% 10%, #e0e7ff 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, #fef3c7 0%, transparent 40%);
    color: #1f2937;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 30px 40px;
    display: flex;
    justify-content: center;
    position: fixed;
    top: 0; width: 100%;
    z-index: 100;
  }
  .logo { font-weight: 200; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; }

  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 700px;
    margin: 0 auto;
    width: 100%;
    padding: 100px 20px 140px;
    overflow-y: auto;
    scrollbar-width: none;
  }

  .message {
    margin-bottom: 60px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  
  .system-bubble {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(80px);
    -webkit-backdrop-filter: blur(80px);
    border-radius: 40px;
    padding: 50px;
    font-size: 34px;
    font-weight: 200;
    line-height: 1.3;
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 20px 50px rgba(0,0,0,0.02);
    width: 110%;
    margin-left: -5%;
  }

  .user-bubble {
    align-self: flex-end;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 20px 35px;
    font-size: 18px;
    font-weight: 400;
    margin-top: -20px;
    margin-right: -10%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    z-index: 2;
  }

  /* Overlapping Image Strip */
  .image-strip {
    display: flex;
    margin: 40px 0;
    justify-content: center;
  }
  .image-strip img {
    width: 250px;
    height: 350px;
    object-fit: cover;
    border-radius: 100px;
    margin: 0 -40px;
    border: 8px solid #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    transition: transform 0.4s;
  }
  .image-strip img:hover { transform: translateY(-20px) scale(1.05); z-index: 10; }

  .chip-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 30px;
  }
  .chip {
    background: rgba(255,255,255,0.6);
    padding: 15px 30px;
    border-radius: 99px;
    border: 1px solid rgba(255,255,255,1);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }

  .composer {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 500px;
    z-index: 100;
  }
  .composer-inner {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(40px);
    border-radius: 99px;
    padding: 20px 40px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.5);
  }
  .composer input {
    background: transparent;
    border: none;
    width: 100%;
    font-size: 16px;
    outline: none;
    text-align: center;
    font-family: inherit;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">PIX Pure</div>
  </header>

  <div class="chat-container">
    <div class="message">
      <div class="system-bubble">
        In der Stille liegt die Kraft.<br>
        Digitales Design in seiner reinsten Form.
      </div>
      <div class="chip-row">
        <div class="chip">Entdecken</div>
        <div class="chip">Kontakt</div>
      </div>
    </div>

    <div class="message">
      <div class="image-strip">
        <img src="../public/media/foto-hd/10_architektur.jpg" alt="M1">
        <img src="../public/media/foto-hd/2_immobilien.webp" alt="M2">
        <img src="../public/media/foto-hd/30_architektur.jpg" alt="M3">
      </div>
      <div class="system-bubble" style="margin-top: -40px; z-index: 1;">
        Klarheit. Fokus. Vision.
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <input type="text" placeholder="Gedanken teilen...">
    </div>
  </div>
</body>
</html>
