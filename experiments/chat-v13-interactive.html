<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PIX Chat - Interactive Minimal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap');

  :root {
    --bg: #000;
    --text: #fff;
    --accent: #fff;
    --user-bubble: rgba(255, 255, 255, 0.1);
    --chip-bg: rgba(255, 255, 255, 0.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overflow-y: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 40px;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }
  .logo { width: 60px; filter: grayscale(1) brightness(2); opacity: 0.3; }

  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 700px; /* Narrower content */
    margin: 0 auto;
    width: 100%;
    padding: 120px 40px 180px;
    overflow-y: auto;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .chat-container::-webkit-scrollbar { display: none; }

  .message-wrapper {
    margin-bottom: 60px;
    display: flex;
    flex-direction: column;
    animation: fadeInUp 0.5s ease forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* System Message: Plain Text */
  .system-bubble {
    font-size: 48px;
    font-weight: 200;
    line-height: 1.15;
    max-width: 100%;
    color: #fff;
  }

  /* User Message: Boxed/Bubble */
  .user-bubble-wrapper {
    align-self: flex-end;
    margin-bottom: 40px;
  }
  .user-bubble {
    background: var(--user-bubble);
    padding: 18px 28px;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 400;
    color: #fff;
    max-width: 80%;
    backdrop-filter: blur(10px);
  }

  .chip-row {
    display: flex;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--chip-bg);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 24px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover {
    background: #fff;
    color: #000;
  }

  .composer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 40px 20px;
    background: linear-gradient(to top, #000 80%, transparent);
    display: flex;
    justify-content: center;
    z-index: 100;
  }
  .composer-inner {
    width: 100%;
    max-width: 700px;
    position: relative;
  }
  .composer input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 40px;
    color: #fff;
    padding: 20px 30px;
    font-size: 18px;
    font-weight: 200;
    outline: none;
    font-family: inherit;
    transition: background 0.3s;
  }
  .composer input:focus {
    background: rgba(255,255,255,0.1);
  }

  /* Image Slider (Filmstrip style from V12) */
  .image-strip {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: 500px;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    margin: 40px 0;
    background: #000;
  }
  .image-strip::-webkit-scrollbar { display: none; }
  .image-strip img {
    height: 100%;
    width: auto;
    min-width: 300px; /* Prevent collapsing */
    flex-shrink: 0;   /* Prevent squashing */
    object-fit: cover;
    opacity: 0.8;
    transition: opacity 0.5s;
    display: block;
  }
  .image-strip img:hover {
    opacity: 1;
  }
</style>
</head>
<body>
  <header>
    <img src="../public/pix-logo.svg" alt="PIX" class="logo">
  </header>

  <div class="chat-container" id="chat">
    <div class="message-wrapper">
      <div class="system-bubble">
        Stille ist die höchste Form der Kommunikation. Wie kann ich dir heute helfen?
      </div>
      <div class="chip-row">
        <div class="chip" onclick="handleChip('Portfolio')">Portfolio</div>
        <div class="chip" onclick="handleChip('Services')">Services</div>
        <div class="chip" onclick="handleChip('Kontakt')">Kontakt</div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <input type="text" id="userInput" placeholder="Schreib etwas..." onkeypress="handleKeyPress(event)">
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');

    function addMessage(text, isUser = false) {
      const wrapper = document.createElement('div');
      wrapper.className = isUser ? 'user-bubble-wrapper message-wrapper' : 'message-wrapper';
      
      if (isUser) {
        wrapper.innerHTML = `<div class="user-bubble">${text}</div>`;
      } else {
        wrapper.innerHTML = `<div class="system-bubble">${text}</div>`;
      }
      
      chat.appendChild(wrapper);
      
      // Use double RAF to ensure DOM update and layout calculation
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          chat.scrollTop = chat.scrollHeight;
        });
      });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && input.value.trim() !== '') {
        const val = input.value.trim();
        addMessage(val, true);
        input.value = '';
        
        // Mock response
        setTimeout(() => {
          addMessage("Interessant. Erzähl mir mehr über dein Projekt oder wähle eine Option aus.");
        }, 1000);
      }
    }

    function handleChip(text) {
      addMessage(text, true);
      setTimeout(() => {
        if (text === 'Portfolio') {
          // Add image slider before the text response
          const slider = document.createElement('div');
          slider.className = 'image-strip message-wrapper';
          slider.innerHTML = `
            <img src="../public/media/foto-hd/10_architektur.jpg" alt="P1">
            <img src="../public/media/foto-hd/30_architektur.jpg" alt="P2">
            <img src="../public/media/foto-hd/17_business.webp" alt="P3">
            <img src="../public/media/foto-hd/12_event.jpg" alt="P4">
            <img src="../public/media/foto-hd/11_immobilien.png" alt="P5">
          `;
          chat.appendChild(slider);
          
          addMessage("Hier ist ein Einblick in meine neuesten Arbeiten. Jedes Pixel hat seine Bestimmung.");
        } else if (text === 'Services') {
          addMessage("Ich biete Webdesign, Fotografie und Videoproduktion auf höchstem Niveau an.");
        } else {
          addMessage("Du erreichst mich am besten via Email oder direkt hier im Chat.");
        }
      }, 800);
    }
  </script>
</body>
</html>
