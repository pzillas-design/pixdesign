<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PIX Chat - Interactive V14</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap');

  :root {
    --bg: #000;
    --text: #fff;
    --user-bubble: rgba(255, 255, 255, 0.1);
    --chip-bg: rgba(255, 255, 255, 0.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overflow-y: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 40px;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }
  .logo { width: 60px; filter: grayscale(1) brightness(2); opacity: 0.3; }

  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    padding: 120px 60px 180px;
    overflow-y: auto;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .chat-container::-webkit-scrollbar { display: none; }

  .message {
    margin-bottom: 100px;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .system-bubble {
    font-size: 56px;
    font-weight: 200;
    line-height: 1.1;
    max-width: 800px;
  }

  .user-bubble-wrapper {
    align-self: flex-end;
    margin-bottom: 40px;
  }
  .user-bubble {
    background: var(--user-bubble);
    padding: 18px 28px;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 400;
    backdrop-filter: blur(10px);
  }

  .filmstrip {
    width: 100vw;
    margin-left: -60px;
    height: 500px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
    margin-top: 40px;
    background: #000;
  }
  .filmstrip::-webkit-scrollbar { display: none; }
  .filmstrip img {
    height: 100%;
    width: auto;
    object-fit: cover;
    opacity: 0.6;
    transition: opacity 0.5s;
    flex-shrink: 0;
  }
  .filmstrip img:hover { opacity: 1; }

  .chip-row {
    display: flex;
    gap: 15px;
    margin-top: 40px;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--chip-bg);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 24px;
    border-radius: 99px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover {
    background: #fff;
    color: #000;
  }

  .composer {
    position: fixed;
    bottom: 60px;
    right: 60px;
    z-index: 1000;
  }
  .composer input {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    font-weight: 200;
    outline: none;
    text-align: right;
    font-family: inherit;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 5px;
  }
</style>
</head>
<body>
  <header>
    <img src="../public/pix-logo.svg" alt="PIX" class="logo">
  </header>

  <div class="chat-container" id="chat">
    <div class="message">
      <div class="system-bubble">
        Stille ist die höchste Form der Kommunikation.
      </div>
      <div class="chip-row">
        <div class="chip" onclick="handleChip('Portfolio')">Portfolio</div>
        <div class="chip" onclick="handleChip('Services')">Services</div>
        <div class="chip" onclick="handleChip('Kontakt')">Kontakt</div>
      </div>
    </div>
  </div>

  <div class="composer">
    <input type="text" id="userInput" placeholder="Ihre Nachricht..." onkeypress="handleKeyPress(event)">
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');

    function addMessage(text, isUser = false) {
      const msg = document.createElement('div');
      if (isUser) {
        msg.className = 'user-bubble-wrapper message';
        msg.innerHTML = `<div class="user-bubble">${text}</div>`;
      } else {
        msg.className = 'message';
        msg.innerHTML = `<div class="system-bubble">${text}</div>`;
      }
      chat.appendChild(msg);
      scrollToBottom();
    }

    function addSlider() {
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerHTML = `
        <div class="filmstrip">
          <img src="../public/media/foto-hd/10_architektur.jpg" alt="S1">
          <img src="../public/media/foto-hd/11_immobilien.png" alt="S2">
          <img src="../public/media/foto-hd/30_architektur.jpg" alt="S3">
          <img src="../public/media/foto-hd/17_business.webp" alt="S4">
        </div>
      `;
      chat.appendChild(msg);
      scrollToBottom();
    }

    function scrollToBottom() {
      setTimeout(() => {
        chat.scrollTop = chat.scrollHeight;
      }, 50);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && input.value.trim() !== '') {
        const val = input.value.trim();
        addMessage(val, true);
        input.value = '';
        setTimeout(() => {
          addMessage("Ein interessanter Gedanke. Wie kann ich darauf aufbauen?");
        }, 1000);
      }
    }

    function handleChip(text) {
      addMessage(text, true);
      setTimeout(() => {
        if (text === 'Portfolio') {
          addSlider();
          addMessage("Präzision in jedem Detail. Hier sind einige meiner Arbeiten.");
        } else if (text === 'Services') {
          addMessage("Ich biete High-End Webdesign, Architekturfotografie und Motion Design an.");
        } else {
          addMessage("Lass uns ein Gespräch beginnen. Du erreichst mich per Mail oder direkt hier.");
        }
      }, 600);
    }
  </script>
</body>
</html>
